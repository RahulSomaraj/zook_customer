name: zook_customer_app
description: "Zook — UAE's trusted secondhand marketplace (customer app)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Version pinned by flutter_localizations.
  intl: any

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.7

  # UI / fonts
  google_fonts: ^6.2.1

  # Vector icons / brand logos
  flutter_svg: ^2.0.10

  # Networking (wired later)
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Dependency injection
  get_it: ^7.7.0

  # Local storage
  shared_preferences: ^2.3.2

  # Functional error handling
  dartz: ^0.10.1

  # Auto OTP detection — Android SMS User Consent API (works with any OTP
  # SMS, no app-hash needed, so it's Twilio Verify compatible).
  smart_auth: ^3.1.1

  # Google sign-in via Supabase (native ID-token flow, no browser redirect).
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code generation for models (wired later)
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  # Runs gen-l10n on build: lib/l10n/*.arb → lib/l10n/gen/app_localizations*.
  generate: true

  assets:
    - assets/images/
    - assets/icons/
